name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check backend
      - run: uv run python scripts/validate_content.py
      - run: uv run python scripts/check_ui_terms.py
      - run: uv run python scripts/check_error_catalog.py
      - run: uv run python scripts/check_css_ownership.py
      - run: uv run python scripts/check_typography_contract.py
      - run: uv run python scripts/generate_content_runtime_coverage.py
      - run: git diff --exit-code -- docs/engineering/CONTENT_RUNTIME_COVERAGE.md
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../requirements.txt
      - run: npm ci
      - run: (cd .. && python -m uvicorn backend.app:app --port 8000 > /tmp/yungang-api.log 2>&1 &)
      - run: sleep 2
      - run: npm run api:generate
      - run: git diff --exit-code -- src/shared/api/generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: node ../scripts/check-asset-budgets.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
